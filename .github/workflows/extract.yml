name: extract

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: extract-main
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      count: ${{ steps.mk.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      # Liveness signal: lets the orchestrator (outside GitHub) confirm within
      # ~1 minute that Actions is enabled and the run started. Pushed to the
      # 'status' branch which does NOT match the trigger branches (no loops).
      - name: Heartbeat
        run: |
          git config user.name "extract-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "$(date -u +%FT%TZ) run=$GITHUB_RUN_ID sha=$GITHUB_SHA" >> heartbeat.txt
          git add heartbeat.txt
          git commit -m "heartbeat run $GITHUB_RUN_ID" || true
          git push --force origin HEAD:status

      - id: mk
        run: |
          git ls-remote --heads origin 'refs/heads/v/*' | sed 's|.*refs/heads/v/||' > /tmp/done_branches.txt
          python3 - <<'EOF'
          import json, os
          vids = {v['n']: v for v in json.load(open('videos.json'))}
          batch = json.load(open('queue/batch.json'))
          want = batch.get('videos') or []
          force_all = bool(batch.get('force_all'))
          force_list = batch.get('force') or []
          done = set()
          for line in open('/tmp/done_branches.txt'):
              line = line.strip()
              if line.isdigit():
                  done.add(int(line))
          rows = []
          for n in want:
              v = vids.get(n)
              if not v or v['paper'] not in (1, 2):
                  continue
              if n in done and not force_all and n not in force_list:
                  continue
              rows.append({'n': n, 'id': v['id']})
          m = json.dumps({'include': rows})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + m + '\n')
              f.write('count=' + str(len(rows)) + '\n')
          print('planned videos:', [r['n'] for r in rows])
          EOF

  extract:
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr > /dev/null 2>&1
          pip install -q --upgrade yt-dlp bgutil-ytdlp-pot-provider pillow

      - name: Start PO-token server
        run: |
          docker run --name pot -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || echo "POT server unavailable"
          sleep 10
          curl -s http://127.0.0.1:4416/ping || echo "no POT ping"

      - name: Extract
        env:
          V_N: ${{ matrix.n }}
        run: python3 extract.py "$V_N" 2>&1 | tee extract.log || true

      - name: Push results
        env:
          V_N: ${{ matrix.n }}
          V_ID: ${{ matrix.id }}
        run: |
          BR="v/$(printf '%03d' "$V_N")"
          git config user.name "extract-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR" "$GITHUB_SHA"
          mkdir -p "out/$V_N"
          if [ -d "/tmp/out/$V_N" ]; then cp -r "/tmp/out/$V_N/." "out/$V_N/"; fi
          cp extract.log "out/$V_N/" 2>/dev/null || true
          git add -A out/
          git commit -m "extract video $V_N ($V_ID)" || echo "nothing new to commit"
          if git push origin "$BR" 2>/tmp/push_err; then
            echo "pushed $BR"
          else
            echo "push conflicted, force retry"
            git fetch origin "$BR" || true
            git push --force origin "$BR" || echo "PUSH FAILED: $(cat /tmp/push_err)"
          fi
